# On every push: type-check, unit tests, and a Playwright smoke test of the built desk with sample data.
name: Check
on:
  push:
    branches: [main]
    paths-ignore: ["agents/out/**", "published/**"]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npx vitest run
      - run: npm run build:single
      - run: npx playwright install --with-deps chromium
      - run: node scripts/smoke.mjs
